name: Scraping hackathons Maroc

# Dépôt dédié : https://github.com/niangmamath/hackathon
# (projet à part, pas mélangé avec le monorepo de sourcing bancaire).
#
# Déclencheur : tous les jours à 05:23 UTC (≈ 06h20 heure Maroc), comme le
# site de stages. Minute volontairement décalée du début d'heure : le cron
# GitHub Actions est "best-effort" et les crons à HH:00 sont les plus
# retardés (constaté en 11/2026 : runs prévus à 06:00 lancés 7 à 12 h
# plus tard). Le volume de requêtes réseau par run reste modeste
# (3 sources, <100 pages au total) : pas de risque de rate-limit.
#
# Prérequis Settings → Secrets and variables → Actions sur ce dépôt :
#   - DATABASE_URL  (chaîne Neon Postgres directe, port 5432, ?sslmode=require)
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      # On restaure le cache de collecte brute entre deux runs. Le gain
      # réseau est modeste (les sources ne sont pas rate-limitées comme
      # LinkedIn), mais cela garde `annonces_vues.json` cohérent run
      # après run (premiere_detection stable).
      - name: Restaurer le cache de scraping
        uses: actions/cache/restore@v4
        with:
          path: |
            cache_hackathons.json
            annonces_vues.json
          key: hackathons-maroc-cache-${{ github.run_id }}
          restore-keys: |
            hackathons-maroc-cache-

      - name: "Run complet (collecte + classification + synchro Neon)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python hackathons_maroc.py

      - name: Sauvegarder le cache de scraping (même si le run a échoué)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache_hackathons.json
            annonces_vues.json
          key: hackathons-maroc-cache-${{ github.run_id }}

      - name: Journaux en cas d'échec
        if: failure()
        run: echo "Le run a échoué — voir les logs de l'étape précédente pour le détail."
