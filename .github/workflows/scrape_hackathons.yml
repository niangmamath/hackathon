name: Scraping hackathons Maroc

# Dépôt dédié : https://github.com/niangmamath/hackathon
# (projet à part, pas mélangé avec le monorepo de sourcing bancaire).
#
# Déclencheur : tous les 2 jours à 06:00 UTC (≈ 07h heure Maroc en hiver,
# 08h en été). Cron GitHub Actions est "best-effort" côté horaire — un
# retard de quelques minutes/heures ne pose pas de problème ici : les
# hackathons ont des fenêtres de plusieurs jours, pas des publications
# qui expirent dans l'heure. Le volume de requêtes réseau par run reste
# modeste (3 sources, <100 pages au total) : pas de risque de rate-limit.
#
# Note : `*/2` sur le jour du mois saute du 31 au 1er en conservant la
# parité (31 impair -> 1 impair) sauf les mois à 30 jours où il y a un
# gap d'un jour (30 pair -> 1 impair). Acceptable pour une veille à
# cadence "tous les 2 jours environ".
#
# Prérequis Settings → Secrets and variables → Actions sur ce dépôt :
#   - DATABASE_URL  (chaîne Neon Postgres directe, port 5432, ?sslmode=require)
on:
  schedule:
    - cron: "0 6 */2 * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      # On restaure le cache de collecte brute entre deux runs. Le gain
      # réseau est modeste (les sources ne sont pas rate-limitées comme
      # LinkedIn), mais cela garde `annonces_vues.json` cohérent run
      # après run (premiere_detection stable).
      - name: Restaurer le cache de scraping
        uses: actions/cache/restore@v4
        with:
          path: |
            cache_hackathons.json
            annonces_vues.json
          key: hackathons-maroc-cache-${{ github.run_id }}
          restore-keys: |
            hackathons-maroc-cache-

      - name: "Run complet (collecte + classification + synchro Neon)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python hackathons_maroc.py

      - name: Sauvegarder le cache de scraping (même si le run a échoué)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache_hackathons.json
            annonces_vues.json
          key: hackathons-maroc-cache-${{ github.run_id }}

      - name: Journaux en cas d'échec
        if: failure()
        run: echo "Le run a échoué — voir les logs de l'étape précédente pour le détail."
